name: Security Tests

on:
  push:
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qasecurity
          POSTGRES_PASSWORD: qasecurity
          POSTGRES_DB: qasecuritylab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U qasecurity -d qasecuritylab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
        run: npx prisma db init --db "$DATABASE_URL"

      - name: Seed database
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
        run: |
          node reset-seed.mjs
          node seed.mjs

      - name: Generate session secret
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start application
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
        run: |
          npm run dev > app.log 2>&1 &

      - name: Wait for application
        run: npx wait-on http://localhost:3000

      - name: Probe API routes
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
        run: |
          set -euo pipefail

          echo "=== ORDERS API: unauthenticated request must be rejected ==="
          orders_status=$(curl -sS -o /tmp/orders-response.json \
            -w "%{http_code}" \
            http://localhost:3000/api/orders/9)

          echo "Orders status: $orders_status"
          cat /tmp/orders-response.json
          test "$orders_status" = "401"

          echo "=== FINDINGS API: unauthenticated request must be rejected ==="
          findings_status=$(curl -sS -o /tmp/findings-response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "challengeId":"dfp5czb7s8nh0nti4qob12bk",
              "severity":"HIGH",
              "evidence":"Test evidence"
            }' \
            http://localhost:3000/api/findings)

          echo "Findings status: $findings_status"
          cat /tmp/findings-response.json
          test "$findings_status" = "401"

      - name: Run security tests
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
        run: npx playwright test

      - name: Print application log on failure
        if: failure()
        run: cat app.log

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-security-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14
