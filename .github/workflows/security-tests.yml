name: Security Tests

on:
  push:
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qasecurity
          POSTGRES_PASSWORD: qasecurity
          POSTGRES_DB: qasecuritylab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U qasecurity -d qasecuritylab"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Initialize database
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
        run: npx prisma db init --db "$DATABASE_URL"

      - name: Seed database
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
        run: |
          node reset-seed.mjs
          node seed.mjs

      - name: Generate session secret
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start application
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
          IDOR_SECURITY_FIX: "true"
        run: |
          npm run dev > app.log 2>&1 &

      - name: Wait for application
        run: npx wait-on http://localhost:3000

      - name: Probe API routes
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
          IDOR_SECURITY_FIX: "true"
        run: |
          echo "=== ORDERS API ==="
          curl -i \
            -H "X-User-ID: ghllkr7rhyz3wznyz2kxvg7z" \
            http://localhost:3000/api/orders/9

          echo ""
          echo "=== FINDINGS API ==="
          curl -i \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "userId":"ghllkr7rhyz3wznyz2kxvg7z",
              "challengeId":"dfp5czb7s8nh0nti4qob12bk",
              "severity":"HIGH",
              "evidence":"Login returned 401 for failed attempts and did not enforce rate limit with 429."
            }' \
            http://localhost:3000/api/findings

      - name: Run security tests
        env:
          DATABASE_URL: postgresql://qasecurity:qasecurity@localhost:5432/qasecuritylab?schema=public
          IDOR_SECURITY_FIX: "true"
        run: |
          cat app.log
          npx playwright test tests/security
